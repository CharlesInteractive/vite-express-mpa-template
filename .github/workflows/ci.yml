name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      # The build must actually prerender: a page whose #root is still empty
      # would ship, deploy and pass every other check without complaint.
      - name: Verify pages were prerendered
        run: |
          for page in index routea/index routeb/index routec/index; do
            grep -q '<div id="root"><' "dist/$page.html" \
              || { echo "dist/$page.html was not prerendered"; exit 1; }
          done

      # The unit tests exercise the app over a fixture dist/. This proves the
      # real entry point boots against the real build and serves it.
      - name: Smoke-test the Express server
        env:
          PORT: 8007
        run: |
          node server.js &
          curl --retry 20 --retry-delay 1 --retry-connrefused -fsS \
            -o /dev/null http://localhost:8007/
          curl -fsS http://localhost:8007/healthz | grep -q '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            http://localhost:8007/does-not-exist)" = "404"
